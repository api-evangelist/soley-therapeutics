aid: soley-therapeutics
name: Soley Therapeutics
description: 'Soley Therapeutics is a science-first, tech-enabled drug discovery and development
  company headquartered in South San Francisco, California, using human cells as biological
  sensors to uncover first-in-class medicines. Its cell stress sensing platform captures
  time-resolved cellular responses across thousands of features and applies computer vision
  and machine learning to compress them into compact signatures, screening hundreds of
  thousands of compounds per week on proprietary automation and robotics. The company is
  advancing a lead oncology asset for acute myeloid leukemia toward an IND filing, a second
  oncology asset for solid tumors in IND-enabling studies, and non-oncology stress-reducing
  candidates for neurodegenerative and metabolic disease. Soley raised a $200M Series C in
  January 2026, bringing total funding to roughly $290M. The platform is an internal
  discovery engine: Soley is a therapeutics developer, not a software vendor, and publishes
  no public API, developer portal, or machine-readable specification.'
