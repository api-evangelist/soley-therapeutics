  detail: >-
    Soley sells therapeutics, not software - its cell stress sensing platform is an
    internal discovery engine - and no API host exists to document: wildcard DNS makes
    api/docs/developer subdomains resolve to the same WordPress marketing host whose TLS
    certificate covers only the apex and www, the GitHub org holds only two forks of
    third-party ML infrastructure (NVIDIA dcgm-exporter), and no npm or PyPI package
    exists. Note the 202s below are a SiteGround "sg-captcha: challenge" interstitial
    that answers every path including a nonsense control, so the marketing site itself
    was never readable by our probe - the no-API finding rests on the DNS, TLS, GitHub
    and registry evidence, not on that host.
